[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quintic-bcov-sequential"
version = "1.3.0"
description = "Auditable sequential quintic holomorphic-ambiguity and PT/GV/DT empirical research suite"
requires-python = ">=3.10"
authors = [{name = "BCOV research collaboration"}]
license = {text = "Research use — see LICENSE.txt"}
dependencies = []

[project.optional-dependencies]
science = ["numpy>=1.24", "scipy", "scikit-learn", "sympy", "pandas", "matplotlib"]
notebook = ["marimo>=0.9", "pandas", "matplotlib"]
test = ["pytest>=7", "numpy", "scikit-learn", "sympy"]
all = ["numpy", "scipy", "scikit-learn", "sympy", "pandas", "matplotlib", "marimo", "pytest"]

[project.scripts]
quintic-bcov = "quintic_bcov_lab.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
